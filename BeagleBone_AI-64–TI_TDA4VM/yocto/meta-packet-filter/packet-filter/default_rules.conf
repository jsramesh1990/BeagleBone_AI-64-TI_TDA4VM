# ============================================================
# Default Packet Filter Rules
# BeagleBone AI-64 - TI TDA4VM
# ============================================================

# Format:
# ACTION PROTOCOL SRC_IP SRC_PORT DST_IP DST_PORT PRIORITY

# Allow SSH
ALLOW TCP 0.0.0.0/0 ANY 0.0.0.0/0 22 10

# Allow HTTP
ALLOW TCP 0.0.0.0/0 ANY 0.0.0.0/0 80 20

# Allow HTTPS
ALLOW TCP 0.0.0.0/0 ANY 0.0.0.0/0 443 30

# Monitor ICMP
MONITOR ICMP 0.0.0.0/0 ANY 0.0.0.0/0 ANY 40

# Default policy is DROP
DEFAULT DROP
